<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ledger — Lending CRM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink: #16232B;
    --ink-soft: #253540;
    --paper: #F5F1E6;
    --paper-raised: #FBF9F3;
    --line: #DDD5C2;
    --charcoal: #2B2620;
    --muted: #8A8270;
    --gold: #B8964F;
    --gold-soft: #E6D8B8;
    --green: #4F7A5C;
    --green-soft: #E1EADD;
    --rust: #B54A34;
    --rust-soft: #F3E0D8;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
  }
  .app{ display:flex; min-height:100vh; }

  /* Sidebar — the ledger spine */
  .spine{
    width: 250px;
    flex-shrink:0;
    background: #003E35;
    color: #EDE7D6;
    display:flex;
    flex-direction:column;
    padding: 22px 0;
    position: relative;
  }
  .spine::after{
    display:none;
  }
  .brand{
    padding: 0 22px 20px 22px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 14px;
  }
  .brand .mark{
    font-family:'Source Serif 4', serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .brand h1{
    font-family:'Source Serif 4', serif;
    font-family:'Inter',sans-serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0;
  }
  .nav{ display:flex; flex-direction:column; gap:2px; padding: 6px 12px; }
  .nav button{
    all:unset;
    cursor:pointer;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    color: #C9C2AE;
    display:flex; align-items:center; gap:10px;
    transition: background 0.15s, color 0.15s;
  }
  .nav button svg{ width:16px; height:16px; opacity:0.85; }
  .nav button:hover{ background: rgba(255,255,255,0.06); color:#EDE7D6; }
  .nav button.active{ background: rgba(255,255,255,0.14); color:#FFFFFF; }
  .spine-footer{
    margin-top:auto; padding: 14px 22px; font-size:11px; color:#7d7660;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  /* Main */
  .main{ flex:1; padding: 30px 40px; max-width:none; min-width:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 26px; }
  .topbar .eyebrow{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .topbar h2{ font-family:'Source Serif 4', serif; font-size:26px; margin:0; font-weight:600; }
  .topbar .date{ font-size:12px; color:var(--muted); font-family:'IBM Plex Mono', monospace; }

  /* Stat cards — like index cards pinned to the ledger */
  .stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom: 26px; }
  .stat-card{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
    position:relative;
  }
  .stat-card .label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:8px; }
  .stat-card .value{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color:var(--ink); }
  .stat-card .sub{ font-size:11px; color:var(--muted); margin-top:4px; }
  .stat-card.accent-green .value{ color: var(--green); }
  .stat-card.accent-rust .value{ color: var(--rust); }
  .stat-card.accent-gold .value{ color: #8f7027; }

  .stats-secondary{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin-bottom: 30px; }
  .mini-card{
    background: var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding: 14px 16px;
    text-align:center;
  }
  .mini-card .num{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; }
  .mini-card .lbl{ font-size:11px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.5px;}
  .mini-card.paid .num{ color: var(--green); }
  .mini-card.active .num{ color: #3a5a9a; }
  .mini-card.overdue .num{ color: var(--rust); }
  .mini-card.interest .num{ color: #8f7027; }

  /* Dashboard inspired by the supplied lending CRM reference */
  .dashboard-cards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-bottom:22px; }
  .dashboard-card{ background:#fff; border:1px solid #DEDCD5; border-radius:14px; min-height:155px; padding:22px 24px; box-shadow:0 2px 7px rgba(25,36,31,.025); }
  .dashboard-card .card-label{ display:flex; align-items:center; gap:10px; color:#615F5A; font-weight:600; font-size:14px; }
  .dashboard-card .card-icon{ width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:9px; font-size:18px; }
  .dashboard-card .card-number{ margin-top:18px; font-family:'IBM Plex Mono',monospace; font-size:30px; line-height:1; font-weight:700; color:#181A18; letter-spacing:-1px; }
  .dashboard-card .card-caption{ margin-top:13px; font-size:12px; color:#9B9891; }
  .dashboard-card.paid .card-icon{ background:#E9F3EF; color:#18745E; }
  .dashboard-card.active-loans .card-icon{ background:#EDF0F7; color:#3E5F88; }
  .dashboard-card.overdue-loans .card-icon{ background:#F9E9EA; color:#B54350; }
  .dashboard-card.interest-total .card-icon{ background:#E9F2EE; color:#18745E; }
  .attention-panel{ background:#fff; border:1px solid #DEDCD5; border-radius:14px; padding:0 24px; margin-bottom:22px; }
  .attention-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 0 16px; border-bottom:1px solid #EAE8E2; }
  .attention-head h3{ margin:0; font-family:'Inter',sans-serif; font-size:17px; font-weight:600; }
  .attention-head span{ color:#9B9891; font-size:12px; }
  .attention-row{ display:flex; align-items:center; gap:14px; padding:18px 8px; border-bottom:1px dashed #E7E3DB; cursor:pointer; }
  .attention-row:last-child{ border-bottom:0; }
  .attention-row:hover{ background:#FCFAF5; }
  .borrower-avatar{ width:42px; height:42px; flex:0 0 42px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:#F9E5E7; color:#B63E4C; font-weight:700; }
  .attention-borrower{ min-width:0; flex:1; }
  .attention-borrower strong{ display:block; color:#1E201D; font-size:14px; }
  .attention-borrower span{ display:block; color:#8E8B84; font-size:12px; margin-top:3px; }
  .attention-amount{ text-align:right; }
  .attention-amount strong{ display:block; font-family:'IBM Plex Mono',monospace; color:#A93342; font-size:15px; }
  .attention-amount span{ display:block; color:#8E8B84; font-size:11px; margin-top:4px; }
  .portfolio-strip{ display:grid; grid-template-columns:repeat(4,1fr); background:#043E35; color:white; border-radius:14px; overflow:hidden; }
  .portfolio-metric{ padding:17px 19px; border-right:1px solid rgba(255,255,255,.12); }
  .portfolio-metric:last-child{ border-right:0; }
  .portfolio-metric small{ display:block; font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:#A7C2BA; }
  .portfolio-metric strong{ display:block; margin-top:5px; font:600 15px 'IBM Plex Mono',monospace; }
  .funding-split{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
  .funding-card{ display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #DEDCD5; border-radius:12px; padding:15px 18px; }
  .funding-card .funding-icon{ width:42px; height:42px; flex:0 0 42px; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:19px; }
  .funding-card.cash .funding-icon{ background:#E8F3EE; color:#176A55; }
  .funding-card.card .funding-icon{ background:#EBEFF8; color:#355B8A; }
  .funding-card small{ display:block; color:#8E8B84; font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .funding-card strong{ display:block; margin-top:3px; font:600 16px 'IBM Plex Mono',monospace; color:#222; }
  .funding-card .funding-count{ margin-left:auto; text-align:right; color:#8E8B84; font-size:11px; }

  .panel{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
  }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .panel-head h3{ font-family:'Source Serif 4', serif; font-size:17px; margin:0; font-weight:600; }
  .panel-head .count{ font-size:12px; color:var(--muted); font-family:'IBM Plex Mono', monospace; }

  .table-scroll-panel{
    padding:0;
    max-height: calc(100vh - 260px);
    overflow: auto;
  }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .loan-table{ min-width:1180px; }
  .loan-table thead th{
    position: sticky; top: 0; z-index: 2;
    background: var(--paper-raised);
    box-shadow: 0 1px 0 var(--line);
  }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.6px;
    color:var(--muted); font-weight:600; padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  tbody td{ padding: 11px 10px; border-bottom: 1px dashed var(--line); vertical-align:middle; }
  tbody tr:hover{ background: rgba(184,150,79,0.06); }
  td.mono, .mono{ font-family:'IBM Plex Mono', monospace; }
  .borrower-name{ font-weight:600; color:var(--ink); }
  .borrower-id{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono', monospace; }

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    padding: 3px 9px; border-radius: 20px; font-size:11px; font-weight:600;
  }
  .badge.paid{ background: var(--green-soft); color: var(--green); }
  .badge.active{ background: #DEE6F2; color:#3a5a9a; }
  .badge.overdue{ background: var(--rust-soft); color: var(--rust); }
  .badge::before{ content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }
  .method-badge{ display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border-radius:7px; font-size:11px; font-weight:700; white-space:nowrap; }
  .method-badge.cash{ background:#E8F3EE; color:#176A55; }
  .method-badge.card{ background:#EBEFF8; color:#355B8A; }
  .method-badge.gcash{ background:#E8EFFB; color:#1F5FCC; }
  .method-badge.maya{ background:#F7E9F5; color:#8A2E82; }
  .method-badge.bank{ background:#FCF1E3; color:#9A5B12; }
  .method-badge .method-icon{ font-size:13px; }
  .method-detail{ margin-top:4px; color:var(--muted); font-size:10px; }

  .btn{
    all:unset; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding: 8px 16px; border-radius:6px; transition: filter 0.15s;
  }
  .btn:hover{ filter: brightness(0.94); }
  .btn.primary{ background: var(--ink); color:#EDE7D6; }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--charcoal); }
  .btn.danger{ background: var(--rust-soft); color:var(--rust); }
  .btn.small{ padding:5px 11px; font-size:12px; }

  .filters{ display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  .filters input[type=text]{
    flex:1; padding:9px 12px; border-radius:6px; border:1px solid var(--line);
    font-family:'Inter'; font-size:13px; background: var(--paper);
  }
  .filter-pill{
    all:unset; cursor:pointer; padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600;
    border:1px solid var(--line); color:var(--muted);
  }
  .filter-pill.active{ background: var(--ink); color:#EDE7D6; border-color: var(--ink); }

  .empty{ text-align:center; padding: 40px 10px; color:var(--muted); }
  .empty .big{ font-family:'Source Serif 4',serif; font-size:16px; color:var(--charcoal); margin-bottom:6px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(22,35,43,0.45); display:flex;
    align-items:center; justify-content:center; z-index:50;
  }
  .modal{
    background: var(--paper-raised); border-radius:12px; width: 420px; max-width:92vw;
    max-height:92vh; overflow-y:auto; padding: 24px 26px; border:1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal h3{ font-family:'Source Serif 4',serif; margin:0 0 16px 0; font-size:19px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:9px 11px; border-radius:6px; border:1px solid var(--line);
    font-family:'Inter'; font-size:13.5px; background:var(--paper);
  }
  .field input:focus, .field select:focus, .filters input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .field input[readonly]{ background:#EEE9DD; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .helper{ font-size:11px; color:var(--muted); margin-top:5px; line-height:1.35; }
  .conditional-fields{ background:#F0F3F8; border:1px solid #DCE2EC; border-radius:9px; padding:12px 12px 0; margin:-2px 0 14px; }
  .section-label{ font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:700; margin:4px 0 10px; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin:18px -26px -24px; padding:14px 26px; position:sticky; bottom:-24px; background:var(--paper-raised); border-top:1px solid var(--line); }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  .calculation-box{ background:var(--green-soft); border:1px solid #cbdac5; border-radius:8px; padding:12px 14px; margin:4px 0 14px; }
  .calculation-box .calc-title{ font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--green); font-weight:700; margin-bottom:7px; }
  .calc-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .calc-grid small{ display:block; color:#667565; font-size:9px; text-transform:uppercase; }
  .calc-grid strong{ display:block; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:13px; margin-top:2px; }
  .detail-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  .detail-item{ border:1px solid var(--line); border-radius:7px; padding:9px 10px; }
  .detail-item small{ display:block; font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.4px; }
  .detail-item strong{ display:block; margin-top:3px; font-size:13px; }
  .person-head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .person-head .person-avatar{ width:44px; height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#E8F3EE; color:#176A55; font-weight:800; }
  .person-head h3{ margin:0; }
  .person-head .person-meta{ margin-top:4px; color:var(--muted); font-size:11px; }
  .person-head .person-status{ margin-left:auto; }
  .person-summary{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
  .person-card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:13px 14px; min-height:88px; }
  .person-card .person-card-label{ display:flex; align-items:center; gap:6px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.35px; }
  .person-card strong{ display:block; margin-top:12px; font:700 17px 'IBM Plex Mono',monospace; color:#1C211E; }
  .person-card.balance strong{ color:var(--rust); }
  .subheading{ font-family:'Source Serif 4',serif; font-size:14px; margin:16px 0 8px; }
  .compact-table{ font-size:12px; }
  .compact-table th,.compact-table td{ padding:7px 6px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform: translateX(-50%);
    background: var(--ink); color:#EDE7D6; padding:10px 18px; border-radius:8px;
    font-size:13px; z-index:60; opacity:0; transition:opacity 0.25s;
  }
  .toast.show{ opacity:1; }

  .loading{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .print-report{ display:none; }

  @media (max-width: 900px){
    .stats, .stats-secondary{ grid-template-columns: repeat(2,1fr); }
    .main{ padding: 20px; }
    .overlay{ align-items:flex-start; padding:10px 0; }
    .modal{ max-height:calc(100vh - 20px); padding:20px; }
    .modal-actions{ margin:16px -20px -20px; padding:12px 20px; bottom:-20px; }
    .field-grid{ grid-template-columns:1fr; gap:0; }
    .calc-grid{ grid-template-columns:1fr; }
    .topbar{ align-items:flex-start; gap:12px; }
    .topbar-actions{ flex-wrap:wrap; justify-content:flex-end; }
  }

  @media (max-width:680px){
    .spine{ width:64px; }
    .brand{ padding-left:16px; padding-right:16px; }
    .brand h1,.brand .mark,.nav button span.label{ display:none; }
    .nav{ padding-left:8px; padding-right:8px; }
    .nav button{ justify-content:center; padding:11px; }
    .spine-footer{ display:none; }
    .dashboard-cards{ gap:10px; }
    .dashboard-card{ padding:16px; min-height:140px; }
    .dashboard-card .card-number{ font-size:24px; }
    .portfolio-strip{ grid-template-columns:1fr 1fr; }
    .funding-split{ grid-template-columns:1fr; }
    .portfolio-metric:nth-child(2){ border-right:0; }
    .portfolio-metric:nth-child(-n+2){ border-bottom:1px solid rgba(255,255,255,.12); }
  }

  @media (max-width:560px){
    .main{ padding:14px; min-width:0; }
    .spine{ width:58px; }
    .stats,.stats-secondary{ grid-template-columns:1fr 1fr; gap:8px; }
    .stat-card{ padding:12px; }
    .stat-card .value{ font-size:17px; }
    .filters{ overflow-x:auto; padding-bottom:4px; }
    .filters input{ min-width:190px; }
    .modal{ width:calc(100vw - 20px) !important; max-width:none; border-radius:10px; }
    .detail-grid{ grid-template-columns:1fr; }
    .person-summary{ grid-template-columns:1fr 1fr; }
    .dashboard-cards{ grid-template-columns:1fr; }
    .dashboard-card{ min-height:128px; }
    .attention-panel{ padding:0 14px; }
    .attention-row{ padding:15px 0; }
  }

  @media print{
    @page{ size:A4 landscape; margin:12mm; }
    body{ background:#fff; color:#111; font-family:Arial,sans-serif; }
    body > #root, body > .overlay, body > .toast{ display:none !important; }
    .print-report{ display:block !important; }
    .print-title{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #16232B; padding-bottom:10px; margin-bottom:16px; }
    .print-title h1{ margin:0; font-family:Georgia,serif; font-size:24px; }
    .print-title p{ margin:3px 0 0; color:#555; font-size:11px; }
    .print-summary{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
    .print-summary div{ border:1px solid #bbb; padding:8px; }
    .print-summary small{ display:block; text-transform:uppercase; color:#666; font-size:8px; letter-spacing:.5px; }
    .print-summary strong{ font-family:'Courier New',monospace; font-size:14px; }
    .print-report table{ font-size:9px; min-width:0; }
    .print-report th, .print-report td{ padding:6px; border-bottom:1px solid #ccc; }
    .print-report th{ color:#333; }
    .print-footer{ margin-top:14px; color:#666; font-size:9px; text-align:right; }
  }
</style>
</head>
<body>
<div id="root" class="loading">Opening the ledger…</div>

<script>
const STORAGE_KEY = 'loans-data';

const state = {
  loans: [],
  view: 'dashboard',
  filter: 'all',
  search: '',
  ready: false,
};

function peso(n){
  const v = Math.round(n);
  return '₱' + v.toLocaleString('en-PH');
}
function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function daysPastDue(iso){
  const due=new Date(iso+'T00:00:00');
  const today=new Date(todayISO()+'T00:00:00');
  return Math.max(0,Math.floor((today-due)/86400000));
}
function initials(name){
  return String(name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function uid(){
  return 'L' + Math.random().toString(36).slice(2,7).toUpperCase();
}
function nextLoanId(){
  const nums = state.loans.map(l=>Number(String(l.id||'').match(/\d+/)?.[0])||0);
  return 'ID' + String(Math.max(0,...nums)+1).padStart(3,'0');
}
function todayISO(){
  return localISO(new Date());
}
function localISO(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function addDays(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return localISO(d);
}

function addMonths(iso, months){
  const d = new Date(iso + 'T00:00:00');
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + months);
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,lastDay));
  return localISO(d);
}

function paymentCountFor(termMonths, frequency){
  const months = Math.max(1, Number(termMonths) || 1);
  if (frequency === 'weekly') return Math.max(1, Math.round(months * 4));
  if (frequency === 'twice-monthly') return Math.max(1, Math.round(months * 2));
  if (frequency === 'quarterly') return Math.max(1, Math.ceil(months / 3));
  if (frequency === 'yearly') return Math.max(1, Math.ceil(months / 12));
  return Math.max(1, Math.round(months));
}

function frequencyLabel(frequency){
  return ({weekly:'Weekly','twice-monthly':'Twice a Month',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly'})[frequency] || 'Monthly';
}
const PAYMENT_METHODS = {
  'cash': { label:'Cash', icon:'₱', cls:'cash' },
  'gcash': { label:'GCash', icon:'◈', cls:'gcash' },
  'maya': { label:'Maya', icon:'◆', cls:'maya' },
  'bank-transfer': { label:'Bank Transfer', icon:'▣', cls:'bank' },
  'credit-card': { label:'Credit Card', icon:'▣', cls:'card' },
};
function methodLabel(method){ return (PAYMENT_METHODS[method] || PAYMENT_METHODS['cash']).label; }
function methodBadge(method,provider){
  const info = PAYMENT_METHODS[method] || PAYMENT_METHODS['cash'];
  const details = provider ? escapeHtml(provider) : '';
  return `<span class="method-badge ${info.cls}"><span class="method-icon">${info.icon}</span>${info.label}</span>${details?`<div class="method-detail">${details}</div>`:''}`;
}

function calculateDueDate(startDate, termMonths, frequency, count){
  if (!startDate) return '';
  const payments = count || paymentCountFor(termMonths,frequency);
  if (frequency === 'weekly') return addDays(startDate,payments*7);
  if (frequency === 'twice-monthly') return addDays(startDate,payments*15);
  if (frequency === 'quarterly') return addMonths(startDate,payments*3);
  if (frequency === 'yearly') return addMonths(startDate,payments*12);
  return addMonths(startDate,payments);
}

function calculateTotal(principal, monthlyRate, termMonths){
  const p = Number(principal) || 0;
  const rate = (Number(monthlyRate) || 0) / 100;
  const months = Math.max(1, Number(termMonths) || 1);
  return p + (p * rate * months);
}

function amountToPay(loan){
  const stored = Number(loan.amountToPay);
  if (Number.isFinite(stored) && stored > 0) return stored;
  return calculateTotal(loan.principal,loan.interestRate,loan.termMonths);
}

function installmentAmount(loan){
  const count = Math.max(1, Number(loan.numberPayments) || paymentCountFor(loan.termMonths,loan.paymentFrequency));
  return amountToPay(loan) / count;
}

function latestCollectionDate(loan){
  if (loan.latestCollectionDate) return loan.latestCollectionDate;
  const payments = Array.isArray(loan.payments) ? loan.payments : [];
  return payments.map(p=>p.date).filter(Boolean).sort().pop() || '';
}

function normalizeLoan(loan){
  const frequency = ['weekly','twice-monthly','monthly','quarterly','yearly'].includes(loan.paymentFrequency) ? loan.paymentFrequency : 'monthly';
  const legacyTerm = Math.max(1, Number(loan.termLength) || 1);
  const termMonths = Math.max(1, Number(loan.termMonths) || (frequency==='yearly'?legacyTerm*12:legacyTerm));
  const startDate = loan.startDate || todayISO();
  const numberPayments = Math.max(1,Number(loan.numberPayments) || paymentCountFor(termMonths,frequency));
  const fundingMethod = loan.fundingMethod === 'credit-card' ? 'credit-card' : 'cash';
  const normalized = {
    ...loan,
    interestRate: Number(loan.interestRate) || 0,
    paymentFrequency: frequency,
    termMonths,
    numberPayments,
    fundingMethod,
    cardBank: fundingMethod==='credit-card' ? String(loan.cardBank||'') : '',
    startDate,
    dueDate: loan.dueDate || calculateDueDate(startDate,termMonths,frequency,numberPayments),
    payments: Array.isArray(loan.payments) ? loan.payments.map(p=>{
      const method = Object.prototype.hasOwnProperty.call(PAYMENT_METHODS,p.method) ? p.method : 'cash';
      return {...p,method,provider:method!=='cash'?String(p.provider||''):''};
    }) : [],
    amountToPay: amountToPay({...loan,termMonths}),
  };
  delete normalized.cardDueDate;
  delete normalized.paymentPerPeriod;
  return normalized;
}

function computeStatus(loan){
  const balance = amountToPay(loan) - loan.collected;
  if (balance <= 0) return 'paid';
  if (loan.dueDate && loan.dueDate < todayISO()) return 'overdue';
  return 'active';
}

const API_BASE = '/api/loans';

async function loadLoans(){
  state.backendOnline = false;
  try{
    const res = await fetch(API_BASE, { cache:'no-store' });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    state.loans = Array.isArray(data.loans) ? data.loans : [];
    state.backendOnline = true;
  }catch(e){
    // backend not reachable (e.g. server not running) — fall back so nothing is lost
    try{
      if (window.storage && window.storage.get){
        const res2 = await window.storage.get(STORAGE_KEY, false);
        state.loans = res2 && res2.value ? JSON.parse(res2.value) : seedData();
      } else {
        const saved = localStorage.getItem(STORAGE_KEY);
        state.loans = saved ? JSON.parse(saved) : seedData();
      }
    }catch(_){ state.loans = seedData(); }
    showToast('Backend not reachable — using local backup copy');
  }
  state.loans = state.loans.map(normalizeLoan);
  state.ready = true;
  render();
}

async function saveLoans(){
  try{
    const res = await fetch(API_BASE, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ loans: state.loans })
    });
    if (!res.ok) throw new Error('save failed');
    state.backendOnline = true;
  }catch(e){
    state.backendOnline = false;
    try{
      if (window.storage && window.storage.set){
        await window.storage.set(STORAGE_KEY, JSON.stringify(state.loans), false);
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.loans));
      }
      showToast('Backend unreachable — saved to local backup instead');
    }catch(_){
      showToast('Could not save — changes may not persist');
    }
  }
}

function seedData(){
  return [];
}

function computeTotals(){
  const totalPrincipal = state.loans.reduce((s,l)=>s+l.principal,0);
  const totalCollected = state.loans.reduce((s,l)=>s+l.collected,0);
  const totalPayable = state.loans.reduce((s,l)=>s+amountToPay(l),0);
  const outstanding = state.loans.reduce((s,l)=>s+Math.max(amountToPay(l)-l.collected,0),0);
  const paidOff = state.loans.filter(l=>computeStatus(l)==='paid').length;
  const active = state.loans.filter(l=>computeStatus(l)==='active').length;
  const overdue = state.loans.filter(l=>computeStatus(l)==='overdue').length;
  const interestEarned = state.loans.reduce((s,l)=>{
    return s + Math.max(amountToPay(l)-l.principal,0);
  },0);
  const collectionRate = totalPayable > 0 ? (totalCollected/totalPayable*100) : 0;
  const cashLoans=state.loans.filter(l=>l.fundingMethod!=='credit-card');
  const cardLoans=state.loans.filter(l=>l.fundingMethod==='credit-card');
  const cashFunded=cashLoans.reduce((s,l)=>s+l.principal,0);
  const cardFunded=cardLoans.reduce((s,l)=>s+l.principal,0);
  return { totalPrincipal, totalPayable, totalCollected, outstanding, paidOff, active, overdue, interestEarned, collectionRate, cashFunded, cardFunded, cashCount:cashLoans.length, cardCount:cardLoans.length };
}

  const loanId = document.getElementById('f_id').value.trim().toUpperCase();
  const name = document.getElementById('f_name').value.trim();
  const principal = parseFloat(document.getElementById('f_principal').value);
  const interestRate = parseFloat(document.getElementById('f_interest').value) || 0;
  const paymentFrequency = document.getElementById('f_frequency').value;
  const termMonths = Math.max(1, parseInt(document.getElementById('f_term').value) || 1);
  const startDate = document.getElementById('f_start').value;
  const fundingMethod = document.getElementById('f_funding').value;
  const cardBank = fundingMethod==='credit-card' ? document.getElementById('f_card_bank').value.trim() : '';
  const numberPayments = paymentCountFor(termMonths,paymentFrequency);
  const dueDate = calculateDueDate(startDate,termMonths,paymentFrequency,numberPayments);
  const calculatedAmount = calculateTotal(principal,interestRate,termMonths);

  if (!loanId){ showToast('Loan ID is required'); return; }
  if (!id && state.loans.some(l=>l.id.toUpperCase()===loanId)){ showToast('That loan ID already exists'); return; }
  if (!name){ showToast('Borrower name is required'); return; }
  if (!principal || principal <= 0){ showToast('Enter a valid principal amount'); return; }
  if (interestRate < 0){ showToast('Interest rate cannot be negative'); return; }
  if (!startDate){ showToast('Start date is required'); return; }
  if (fundingMethod==='credit-card' && !cardBank){ showToast('Enter the credit card or bank name'); return; }

  if (id){
    const loan = state.loans.find(l=>l.id===id);
    Object.assign(loan,{name,principal,dueDate,interestRate,paymentFrequency,termMonths,startDate,numberPayments,fundingMethod,cardBank,amountToPay:calculatedAmount});
    delete loan.cardDueDate;
  } else {
    state.loans.push({id:loanId,name,principal,collected:0,dueDate,interestRate,paymentFrequency,termMonths,startDate,numberPayments,fundingMethod,cardBank,amountToPay:calculatedAmount,payments:[]});
  }
  saveLoans();
  closeModal();
  render();
  showToast(id ? 'Loan updated' : 'Loan added');
}

function openPaymentModal(id){
  const loan = state.loans.find(l=>l.id===id);
  if (!loan) return;
  const modalRoot = document.createElement('div');
  modalRoot.className='overlay'; modalRoot.id='modalOverlay';
  modalRoot.innerHTML=`<div class="modal" style="width:430px"><h3>Record payment</h3>
    <div class="detail-item" style="margin-bottom:14px"><small>Borrower · ${loan.id}</small><strong>${escapeHtml(loan.name)}</strong><div class="helper">Balance: ${peso(Math.max(amountToPay(loan)-loan.collected,0))} · Planned: ${peso(installmentAmount(loan))}</div></div>
    <div class="field"><label for="p_date">Collection date</label><input id="p_date" type="date" value="${todayISO()}" /></div>

function updatePaymentMethodFields(){
  const fields=document.getElementById('p_card_fields');
  const label=document.getElementById('p_provider_label');
  const method=document.getElementById('p_method').value;
  if(fields)fields.style.display=method==='cash'?'none':'block';
  if(label)label.textContent=method==='bank-transfer'?'Bank name / reference no.':'Reference no. (optional)';
}

function submitPayment(id){
  const loan=state.loans.find(l=>l.id===id);
  const date=document.getElementById('p_date').value;
  const amount=parseFloat(document.getElementById('p_amount').value);
  const method=document.getElementById('p_method').value;
  const provider=method!=='cash'?document.getElementById('p_provider').value.trim():'';
  const note=document.getElementById('p_note').value.trim();
  if(!date){showToast('Collection date is required');return;}
  if(!amount||amount<=0){showToast('Enter a valid payment amount');return;}
  loan.payments=Array.isArray(loan.payments)?loan.payments:[];
  loan.payments.push({id:'P'+Date.now().toString(36).toUpperCase(),date,amount,method,provider,note});
  loan.collected=(Number(loan.collected)||0)+amount;
  loan.latestCollectionDate=date;
  saveLoans(); closeModal(); render(); showToast('Payment recorded');
}

function scheduleDate(loan,index){
  if(loan.paymentFrequency==='weekly')return addDays(loan.startDate,index*7);
  if(loan.paymentFrequency==='twice-monthly')return addDays(loan.startDate,index*15);
  if(loan.paymentFrequency==='quarterly')return addMonths(loan.startDate,index*3);
  if(loan.paymentFrequency==='yearly')return addMonths(loan.startDate,index*12);
  return addMonths(loan.startDate,index);
}

function buildSchedule(loan){
  const count=Math.max(1,loan.numberPayments||1);
  const principalPart=loan.principal/count;
  const interestPart=Math.max(amountToPay(loan)-loan.principal,0)/count;
  return Array.from({length:count},(_,i)=>({
    number:i+1,date:scheduleDate(loan,i+1),beginning:Math.max(loan.principal-principalPart*i,0),
    payment:principalPart+interestPart,interest:interestPart,principal:principalPart,ending:Math.max(loan.principal-principalPart*(i+1),0)
  }));
}

function nextPaymentInfo(loan){
  const total=amountToPay(loan);
  const collected=Math.max(0,Math.min(Number(loan.collected)||0,total));
  const balance=Math.max(total-collected,0);
  if(balance<=0.01)return null;
  const schedule=buildSchedule(loan);
  const installment=total/Math.max(1,loan.numberPayments||1);
  const completed=Math.min(Math.floor((collected+0.01)/installment),schedule.length-1);
  const appliedToCurrent=collected-(completed*installment);
  return {number:completed+1,date:schedule[completed].date,amount:Math.min(Math.max(installment-appliedToCurrent,0),balance),balance};
}

function upcomingPaymentsNextMonth(loans){
  const start=todayISO();
  const end=addMonths(start,1);
  return loans.map(loan=>({loan,next:nextPaymentInfo(loan)})).filter(x=>x.next&&x.next.date>=start&&x.next.date<=end).sort((a,b)=>a.next.date.localeCompare(b.next.date));
}

  const cols=[{x:58,w:345,label:'BORROWER / ID'},{x:415,w:240,label:'FUNDING'},{x:667,w:280,label:'PAYMENT PLAN'},{x:959,w:205,label:'COLLECTIBLE'},{x:1176,w:185,label:'COLLECTED'},{x:1373,w:169,label:'BALANCE'}];
  ctx.fillStyle='#E9E6DE';ctx.fillRect(48,267,1504,42);ctx.fillStyle='#6F6B64';ctx.font='700 12px Arial';cols.forEach(c=>ctx.fillText(c.label,c.x,293));
  function fit(text,max){const original=String(text);let shown=original;while(shown.length&&ctx.measureText(shown+(shown.length<original.length?'…':'')).width>max)shown=shown.slice(0,-1);return shown+(shown.length<original.length?'…':'');}
  loans.forEach((l,i)=>{const y=309+i*rowHeight;if(i%2===0){ctx.fillStyle='#FFFFFF';ctx.fillRect(48,y,1504,rowHeight);}ctx.fillStyle='#202521';ctx.font='700 15px Arial';ctx.fillText(fit(l.name,300),58,y+23);ctx.fillStyle='#88847C';ctx.font='12px monospace';ctx.fillText(l.id,58,y+43);ctx.fillStyle=l.fundingMethod==='credit-card'?'#355B8A':'#176A55';ctx.font='700 14px Arial';ctx.fillText(methodLabel(l.fundingMethod),415,y+25);ctx.fillStyle='#88847C';ctx.font='12px Arial';ctx.fillText(fit(l.cardBank||'',205),415,y+43);ctx.fillStyle='#202521';ctx.font='14px Arial';ctx.fillText(`${frequencyLabel(l.paymentFrequency)} · ${l.numberPayments} × ${peso(installmentAmount(l))}`,667,y+31);ctx.font='700 14px monospace';ctx.fillText(peso(amountToPay(l)),959,y+31);ctx.fillStyle='#176A55';ctx.fillText(peso(l.collected),1176,y+31);ctx.fillStyle='#A93342';ctx.fillText(peso(Math.max(amountToPay(l)-l.collected,0)),1373,y+31);});
  if(id){const listY=405;ctx.fillStyle='#202521';ctx.font='700 20px Arial';ctx.fillText(`Payment records (${payments.length})`,58,listY);const paymentCols=[{x:58,label:'PAYMENT DATE'},{x:370,label:'AMOUNT'},{x:650,label:'METHOD'},{x:1050,label:'NOTE'}];ctx.fillStyle='#E9E6DE';ctx.fillRect(48,listY+22,1504,38);ctx.fillStyle='#6F6B64';ctx.font='700 12px Arial';paymentCols.forEach(c=>ctx.fillText(c.label,c.x,listY+47));payments.forEach((p,i)=>{const y=listY+60+i*50;if(i%2===0){ctx.fillStyle='#FFFFFF';ctx.fillRect(48,y,1504,50);}ctx.fillStyle='#222';ctx.font='13px monospace';ctx.fillText(fmtDate(p.date),58,y+31);ctx.fillText(peso(p.amount),370,y+31);ctx.font='13px Arial';ctx.fillText(`${methodLabel(p.method)}${p.provider?' · '+fit(p.provider,220):''}`,650,y+31);ctx.fillStyle='#666';ctx.fillText(fit(p.note||'—',440),1050,y+31);});}

function generatePDF(id){

    a.balance += Math.max(amountToPay(l)-l.collected,0);

  },{principal:0,payable:0,collected:0,balance:0});

  report.className = 'print-report';
  report.innerHTML = `
    <div class="print-title">
      <div><h1>Ledger — Loan ${id?'Statement':'Portfolio Report'}</h1><p>${id?'Borrower account details':'Complete loan portfolio'}</p></div>

      <div><small>Collected</small><strong>${peso(totals.collected)}</strong></div>

    <table>

      <tbody>${loans.map(l=>{
        const status=computeStatus(l);
        return `<tr><td><strong>${escapeHtml(l.name)}</strong><br>${l.id}</td><td>${peso(l.principal)}</td><td>${methodLabel(l.fundingMethod)}${l.cardBank?' · '+escapeHtml(l.cardBank):''}</td><td>${Number(l.interestRate).toFixed(2)}%</td><td>${l.termMonths} months</td><td>${frequencyLabel(l.paymentFrequency)} · ${l.numberPayments}</td><td>${peso(installmentAmount(l))}</td><td>${peso(amountToPay(l))}</td><td>${peso(l.collected)}</td><td>${peso(Math.max(amountToPay(l)-l.collected,0))}</td><td>${fmtDate(l.dueDate)}</td><td>${status.toUpperCase()}</td></tr>`;
      }).join('')}</tbody>
    </table>
    <h2 style="font:16px Georgia,serif;margin:18px 0 7px">Upcoming payments — next 1 month</h2>${upcoming.length?`<table><thead><tr><th>Borrower / ID</th><th>Payment</th><th>Due date</th><th>Amount due</th><th>Remaining balance</th></tr></thead><tbody>${upcoming.map(x=>`<tr><td><strong>${escapeHtml(x.loan.name)}</strong><br>${x.loan.id}</td><td>#${x.next.number}</td><td>${fmtDate(x.next.date)}</td><td>${peso(x.next.amount)}</td><td>${peso(x.next.balance)}</td></tr>`).join('')}</tbody></table>`:`<p style="font-size:10px;color:#666">No upcoming payments are due within the next month.</p>`}
    ${id?`<h2 style="font:16px Georgia,serif;margin:18px 0 7px">Payment records (${(loans[0].payments||[]).length})</h2>${(loans[0].payments||[]).length?`<table><thead><tr><th>Payment date</th><th>Amount</th><th>Method</th><th>Note</th></tr></thead><tbody>${[...(loans[0].payments||[])].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${peso(p.amount)}</td><td>${methodLabel(p.method)}${p.provider?' · '+escapeHtml(p.provider):''}</td><td>${escapeHtml(p.note||'—')}</td></tr>`).join('')}</tbody></table>`:`<p style="font-size:10px;color:#666">No dated payment records yet.</p>`}`:''}
    <div class="print-footer">Ledger Lending CRM · Keep this report for your records.</div>`;
  document.body.appendChild(report);
  const cleanup = ()=>{ report.remove(); window.removeEventListener('afterprint',cleanup); };

}
